<script type="text/plain" id="gsCode">
/**
 * Katamata Group - Backend Google Sheets (Google Apps Script)
 * Tempel kode ini di: Google Sheet > Extensions (Ekstensi) > Apps Script
 * Lalu ganti SECRET, Deploy sebagai Web App (Execute as: Me, Who has access: Anyone).
 */
var SECRET = 'GANTI_TOKEN_RAHASIA';
var COLLECTIONS = ['orgs','categories','employees','vendors','locations','users','purchases','assets','loans','services','placements','activity'];
var NUM_FIELDS = {price:1, warrantyValue:1, depMonths:1, cost:1, createdAt:1, updatedAt:1, ts:1};
var CHUNK = 45000; // batas sel Google Sheets = 50.000 karakter
var API_VERSION = 3; // v3: koleksi 'placements' (Lokasi Aset Tetap)

function doGet(e){
  var p = (e && e.parameter) || {};
  if(p.check !== undefined){ // diagnosa token: buka URL/exec?check=TOKEN_ANDA
    var s = String(SECRET), t = String(p.check);
    return out_({ok:true, version:API_VERSION, collections:COLLECTIONS, tokenMatch:(t.trim() === s.trim()), secretStillDefault:(s === 'GANTI_TOKEN_RAHASIA'), secretHasEdgeSpace:(s !== s.trim())});
  }
  return out_({ok:true, version:API_VERSION, collections:COLLECTIONS, message:'Katamata Group Sheets API aktif. Gunakan dari aplikasi Katamata Group.'});
}

function doPost(e){
  var p;
  try { p = JSON.parse(e.postData.contents); } catch(err){ return out_({ok:false, error:'Permintaan tidak valid'}); }
  if(!p || String(p.token || '').trim() !== String(SECRET).trim()) return out_({ok:false, error:'Token salah'});
  var lock = LockService.getScriptLock();
  try { lock.waitLock(28000); } catch(err){ return out_({ok:false, error:'Server sibuk, coba lagi'}); }
  try {
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    if(p.action === 'ping') return out_({ok:true, rev:getRev_(ss), version:API_VERSION, collections:COLLECTIONS});
    if(p.action === 'pull') return out_(pull_(ss));
    if(p.action === 'push') return out_(push_(ss, p));
    return out_({ok:false, error:'Aksi tidak dikenal'});
  } catch(err){
    return out_({ok:false, error:String(err)});
  } finally {
    lock.releaseLock();
  }
}

function out_(o){
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}
function sheet_(ss, name){
  var s = ss.getSheetByName(name);
  if(!s) s = ss.insertSheet(name);
  return s;
}
function ensure_(s, r, c){
  if(s.getMaxRows() < r) s.insertRowsAfter(s.getMaxRows(), r - s.getMaxRows());
  if(s.getMaxColumns() < c) s.insertColumnsAfter(s.getMaxColumns(), c - s.getMaxColumns());
}
function getRev_(ss){
  var s = ss.getSheetByName('_meta');
  if(!s) return 0;
  return Number(s.getRange('B1').getValue()) || 0;
}
function setMeta_(ss, rev, user){
  var s = sheet_(ss, '_meta');
  var rg = s.getRange('A1:B3');
  rg.setNumberFormat('@');
  rg.setValues([['rev', rev], ['updatedAt', new Date().toISOString()], ['updatedBy', user || '']]);
}

/* ---------- PULL ---------- */
function pull_(ss){
  var tz = ss.getSpreadsheetTimeZone(), data = {}, files = {};
  COLLECTIONS.forEach(function(name){ data[name] = readSheet_(ss, name, tz); });
  var fs = ss.getSheetByName('_files');
  if(fs && fs.getLastRow() > 1){
    fs.getRange(2, 1, fs.getLastRow() - 1, 3).getValues().forEach(function(r){
      if(!r[0]) return;
      files[r[0]] = (files[r[0]] || '') + r[2];
    });
  }
  return {ok:true, rev:getRev_(ss), version:API_VERSION, collections:COLLECTIONS, data:data, files:files};
}
function readSheet_(ss, name, tz){
  var s = ss.getSheetByName(name);
  if(!s || s.getLastRow() < 2 || s.getLastColumn() < 1) return [];
  var v = s.getRange(1, 1, s.getLastRow(), s.getLastColumn()).getValues(), h = v[0], out = [];
  for(var i = 1; i < v.length; i++){
    if(v[i].join('') === '') continue;
    var o = {};
    for(var j = 0; j < h.length; j++){
      var k = h[j]; if(k === '') continue;
      var x = v[i][j];
      if(x instanceof Date) x = Utilities.formatDate(x, tz, 'yyyy-MM-dd');
      else if(typeof x === 'string' && x.indexOf('JSON:') === 0){ try { x = JSON.parse(x.substring(5)); } catch(e){} }
      else if(NUM_FIELDS[k]) x = (x === '' ? '' : Number(x));
      else if(typeof x === 'number') x = String(x);
      o[k] = x;
    }
    out.push(o);
  }
  return out;
}

/* ---------- PUSH ---------- */
function push_(ss, p){
  var cur = getRev_(ss);
  if(Number(p.baseRev) !== cur) return {ok:false, conflict:true, rev:cur};
  COLLECTIONS.forEach(function(name){ writeSheet_(ss, name, (p.data && p.data[name]) || []); });
  writeFiles_(ss, p.files || {}, p.keepFiles || []);
  var rev = cur + 1;
  setMeta_(ss, rev, p.user);
  return {ok:true, rev:rev, collections:COLLECTIONS};
}
function writeSheet_(ss, name, rows){
  var s = sheet_(ss, name);
  s.clear();
  if(!rows.length) return;
  var h = [];
  rows.forEach(function(r){ Object.keys(r).forEach(function(k){ if(h.indexOf(k) < 0) h.push(k); }); });
  var idx = h.indexOf('id');
  if(idx > 0){ h.splice(idx, 1); h.unshift('id'); }
  var vals = [h];
  rows.forEach(function(r){
    vals.push(h.map(function(k){
      var x = r[k];
      if(x === null || x === undefined) return '';
      if(typeof x === 'object') return 'JSON:' + JSON.stringify(x);
      return x;
    }));
  });
  ensure_(s, vals.length, h.length);
  var rg = s.getRange(1, 1, vals.length, h.length);
  rg.setNumberFormat('@'); // teks: cegah Sheets mengubah tanggal/serial number
  h.forEach(function(k, j){ if(NUM_FIELDS[k] && vals.length > 1) s.getRange(2, j + 1, vals.length - 1, 1).setNumberFormat('0'); });
  rg.setValues(vals);
  s.getRange(1, 1, 1, h.length).setFontWeight('bold').setBackground('#e6ecf5');
  s.setFrozenRows(1);
}
function writeFiles_(ss, newFiles, keep){
  var s = sheet_(ss, '_files'), map = {}, order = [];
  if(s.getLastRow() > 1){
    s.getRange(2, 1, s.getLastRow() - 1, 3).getValues().forEach(function(r){
      if(!r[0]) return;
      if(!map[r[0]]){ map[r[0]] = []; order.push(r[0]); }
      map[r[0]].push(String(r[2]));
    });
  }
  var keepSet = {}; keep.forEach(function(id){ keepSet[id] = 1; });
  var changed = false, next = [], nextMap = {};
  order.forEach(function(id){ if(keepSet[id]){ nextMap[id] = map[id]; next.push(id); } else changed = true; });
  Object.keys(newFiles).forEach(function(id){
    if(nextMap[id]) return;
    var d = newFiles[id], parts = [];
    for(var i = 0; i < d.length; i += CHUNK) parts.push(d.substr(i, CHUNK));
    nextMap[id] = parts; next.push(id); changed = true;
  });
  if(!changed && s.getLastRow() > 0) return;
  s.clear();
  var rows = [['id', 'idx', 'chunk']];
  next.forEach(function(id){ nextMap[id].forEach(function(c, i){ rows.push([id, i, c]); }); });
  ensure_(s, rows.length, 3);
  s.getRange(1, 1, rows.length, 3).setNumberFormat('@').setValues(rows);
}
</script>
<script>
/* =====================================================================
   Katamata Group — System Asset Management (single file, LocalStorage)
   ===================================================================== */
const STORE_KEY = 'asetku_db_v1';
const MONTHS = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MIN_DEP_PRICE = 500000;
const CONDITIONS = ['Bagus','Rusak Ringan','Rusak Berat'];
const ROLES = ['Super Admin','Admin','Manager','Supervisor','Staff'];
let DB = null;
const UI = { view:'dashboard', tab:{loans:'active', master:'org', reports:'dep'}, q:{}, f:{} };
const TMP = {};
let EDIT_PUR = null;

/* ---------- Utilitas ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const num = n => Math.round(+n || 0).toLocaleString('id-ID');
const idr = n => 'Rp ' + num(n);
const pad = (n,l=2) => String(n).padStart(l,'0');
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const parseDate = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); };
const fmtD = d => { if(!d) return '-'; if(typeof d === 'string') d = parseDate(d); return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear(); };
const fmtDT = ts => { const d = new Date(ts); return fmtD(d)+', '+pad(d.getHours())+':'+pad(d.getMinutes()); };
const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };
const moneyVal = id => +String(val(id)).replace(/\D/g,'') || 0;
const byId = (l,id) => l.find(x => x.id === id);
const match = (q, ...arr) => !q || arr.some(s => String(s ?? '').toLowerCase().includes(q.toLowerCase()));

/* ---------- Lookup ---------- */
const orgName = id => (byId(DB.orgs,id)||{}).name || '-';
const catNameById = id => (byId(DB.categories,id)||{}).name || '-';
const catName = a => catNameById(a.catId);
const empName = id => (byId(DB.employees,id)||{}).name || '-';
const vendorName = id => (byId(DB.vendors,id)||{}).name || '-';
const itemTitle = a => catName(a)+' '+a.brand+' '+a.type;
const currentUser = () => byId(DB.users, DB.session.userId);
const realUser = () => byId(DB.users, DB.session.realUserId || DB.session.userId) || currentUser();
const can = () => { const u = currentUser(); return !!u && (u.role === 'Super Admin' || u.role === 'Admin'); };
const isSA = () => { const u = currentUser(); return !!u && u.role === 'Super Admin'; };
const activeLoan = id => DB.loans.find(l => l.assetId === id && l.status === 'active');
const activePlacement = id => (DB.placements || []).find(p => p.assetId === id && p.status === 'active');
function syncAssetLocations(db){
  const act = {}; (db.placements || []).forEach(p => { if(p.status === 'active') act[p.assetId] = p; });
  db.assets.forEach(a => { const p = act[a.id]; a.fixedLocation = p ? p.location : ''; a.fixedRoom = p ? p.room : ''; });
}
function normalizeDB(d){ d.placements = d.placements || []; d.activity = d.activity || []; syncAssetLocations(d); return d; }
function guardDel(){ if(!isSA()){ toast('Hanya Super Admin yang dapat menghapus data.','error'); return false; } return true; }
const delBtn = (fn, ...a) => isSA() ? `<button class="btn btn-danger btn-sm" onclick="${fn}(${a.map(x => "'"+x+"'").join(',')})" title="Hapus"><i class="fa-solid fa-trash"></i></button>` : '';
const inService = id => DB.services.some(s => s.assetId === id && s.status === 'Dalam Perbaikan');
function guard(){ if(!can()){ toast('Akses ditolak: role '+(currentUser()||{}).role+' hanya dapat melihat data.','error'); return false; } return true; }
function guardSA(){ if(!isSA()){ toast('Hanya Super Admin yang dapat melakukan tindakan ini.','error'); return false; } return true; }
/* ---------- Autentikasi ---------- */
function sha256(ascii){
  const rr = (v,a) => (v>>>a)|(v<<(32-a));
  const maxWord = Math.pow(2,32); let result = '', words = [], bitLen = ascii.length*8;
  let hash = sha256.h = sha256.h || [], k = sha256.k = sha256.k || [], pc = k.length; const comp = {};
  for(let c = 2; pc < 64; c++){ if(!comp[c]){ for(let i = 0; i < 313; i += c) comp[i] = c; hash[pc] = (Math.pow(c,.5)*maxWord)|0; k[pc++] = (Math.pow(c,1/3)*maxWord)|0; } }
  ascii += '\x80'; while(ascii.length % 64 - 56) ascii += '\x00';
  for(let i = 0; i < ascii.length; i++){ const j = ascii.charCodeAt(i); words[i>>2] |= j << ((3-i)%4)*8; }
  words[words.length] = ((bitLen/maxWord)|0); words[words.length] = bitLen;
  for(let j = 0; j < words.length;){
    const w = words.slice(j, j += 16), old = hash; hash = hash.slice(0,8);
    for(let i = 0; i < 64; i++){
      const w15 = w[i-15], w2 = w[i-2], a = hash[0], e = hash[4];
      const t1 = hash[7] + (rr(e,6)^rr(e,11)^rr(e,25)) + ((e&hash[5])^((~e)&hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (w[i-16] + (rr(w15,7)^rr(w15,18)^(w15>>>3)) + w[i-7] + (rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2 = (rr(a,2)^rr(a,13)^rr(a,22)) + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash = [(t1+t2)|0].concat(hash); hash[4] = (hash[4] + t1)|0;
    }
    for(let i = 0; i < 8; i++) hash[i] = (hash[i] + old[i])|0;
  }
  for(let i = 0; i < 8; i++) for(let j = 3; j + 1; j--){ const b = (hash[i]>>(j*8))&255; result += ((b < 16) ? 0 : '') + b.toString(16); }
  return result;
}
const hashPw = pw => sha256(unescape(encodeURIComponent('asetku:'+pw)));
const defaultPw = role => (role === 'Super Admin' || role === 'Admin') ? 'admin123' : 'user123';
function ensurePasswords(db){ let n = 0; db.users.forEach(u => { if(!u.passHash){ u.passHash = hashPw(defaultPw(u.role)); n++; } }); return n; }
let LOGIN_FAILS = 0, LOGIN_LOCK = 0;

/* ---------- Kode barang, penyusutan, garansi ---------- */
function codePrefix(orgId, catId){
  const o = byId(DB.orgs,orgId), c = byId(DB.categories,catId);
  return o && c ? o.code+'/'+c.code : null;
}
function nextSeq(orgId, catId, year){
  const p = codePrefix(orgId,catId); if(!p) return 1;
  let max = 0;
  DB.assets.forEach(a => {
    const x = a.code.split('/');
    if(x.length === 4 && x[0]+'/'+x[1] === p && x[3] === String(year)) max = Math.max(max, parseInt(x[2],10) || 0);
  });
  return max + 1;
}
function genCode(orgId, catId, year){
  const p = codePrefix(orgId,catId); if(!p) return '';
  return p+'/'+pad(nextSeq(orgId,catId,year),3)+'/'+year;
}
function depInfo(a, now=new Date()){
  const price = +a.price || 0, life = +a.depMonths || 0;
  if(price < MIN_DEP_PRICE || life <= 0) return {period:0, life:0, monthly:0, accum:0, book:price, dep:false};
  const b = parseDate(a.buyDate);
  const diff = (now.getFullYear()-b.getFullYear())*12 + (now.getMonth()-b.getMonth());
  const period = Math.min(life, Math.max(1, diff+1));
  const monthly = price/life;
  const accum = Math.min(price, monthly*period);
  return {period, life, monthly, accum, book: price-accum, dep:true};
}
function warrantyInfo(a){
  const v = +a.warrantyValue || 0;
  if(v <= 0) return {status:'none', label:'Tanpa Garansi', end:null, days:0};
  const end = parseDate(a.buyDate);
  end.setMonth(end.getMonth() + (a.warrantyUnit === 'year' ? v*12 : v));
  const t = new Date(); t.setHours(0,0,0,0);
  const active = t <= end;
  return {status: active ? 'active' : 'expired', label: active ? 'Garansi Aktif' : 'Garansi Expired', end, days: Math.ceil((end-t)/86400000)};
}
const warrantyText = a => (+a.warrantyValue||0) > 0 ? a.warrantyValue+' '+(a.warrantyUnit === 'year' ? 'tahun' : 'bulan') : '-';
function warrantyBadge(a){
  const w = warrantyInfo(a);
  const cls = w.status === 'active' ? 'b-green' : w.status === 'expired' ? 'b-red' : 'b-gray';
  const ic = w.status === 'active' ? 'fa-shield-halved' : w.status === 'expired' ? 'fa-shield' : 'fa-minus';
  return `<span class="badge ${cls}"><i class="fa-solid ${ic}"></i>${w.label}</span>`;
}
function condBadge(c){
  const cls = c === 'Bagus' ? 'b-green' : c === 'Rusak Ringan' ? 'b-amber' : 'b-red';
  return `<span class="badge ${cls}">${esc(c)}</span>`;
}
function svcBadge(id){
  return inService(id)
    ? `<span class="badge b-amber"><i class="fa-solid fa-screwdriver-wrench"></i>Dalam Perbaikan</span>`
    : `<span class="badge b-gray">Normal</span>`;
}
function placeholderImg(txt){
  const colors = ['#163a6b','#a34a0a','#0f6b5c','#7a2e6e','#5a6a1a','#8f2f2f'];
  let h = 0; for(const ch of txt) h = (h*31 + ch.charCodeAt(0)) % colors.length;
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><rect width='120' height='120' rx='14' fill='${colors[h]}'/><text x='60' y='74' font-family='Arial,sans-serif' font-size='38' font-weight='700' fill='white' text-anchor='middle'>${esc(txt.slice(0,2).toUpperCase())}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function createPurchase(d){

  const code = genCode(d.orgId, d.catId, year);
  const pid = uid('pur_'), aid = uid('ast_');

  DB.assets.push({

    image:d.image||'', vendorId:d.vendorId, buyDate:d.buyDate, price:+d.price, invoice:d.invoice,
    warrantyValue:+d.warrantyValue||0, warrantyUnit:d.warrantyUnit||'year', depMonths:+d.price >= MIN_DEP_PRICE ? (+d.depMonths||0) : 0,
    condition:d.condition||'Bagus', note:d.note||'', createdAt:Date.now()

/* ---------- File & gambar ---------- */
function fileToImageData(file, max, quality, cb){
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height; const s = Math.min(1, max/Math.max(w,h)); w = Math.round(w*s); h = Math.round(h*s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => toast('File gambar tidak valid.','error');
    img.src = r.result;
  };
  r.readAsDataURL(file);
}
function fileObjFrom(file, cb){
  if(file.type.startsWith('image/')) return fileToImageData(file, 1000, .8, d => cb({name:file.name, mime:'image/jpeg', data:d}));
  if(file.size <= 700*1024){ const r = new FileReader(); r.onload = () => cb({name:file.name, mime:file.type, data:r.result}); r.readAsDataURL(file); }
  else { toast('File lebih dari 700 KB: hanya nama file yang disimpan (mockup).'); cb({name:file.name, mime:file.type, data:null}); }
}
function dataURLtoBlob(u){
  const p = u.split(','), mime = (p[0].match(/:(.*?);/)||[])[1] || 'application/octet-stream', bin = atob(p[1]);
  const arr = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}
function previewFile(o){
  if(!o) return;
  if(!o.data){ toast('Berkas ini hanya tersimpan sebagai nama file: '+o.name); return; }
  if((o.mime || '').startsWith('image/') || o.data.startsWith('data:image')) showModal(esc(o.name), `<img src="${esc(o.data)}" class="max-w-full mx-auto rounded-lg" alt="">`, '', 'max-w-3xl');
  else window.open(URL.createObjectURL(dataURLtoBlob(o.data)), '_blank');
}
function viewProof(pid){ const p = byId(DB.purchases,pid); previewFile(p && p.proof); }
function viewReceipt(lid){ const l = byId(DB.loans,lid); previewFile(l && l.receipt); }

function download(name, content, mime){
  const b = new Blob([content], {type:mime}); const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function toCSV(head, rows){
  const q = c => { const s = String(c ?? ''); return /[";\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  return '\ufeff' + [head, ...rows].map(r => r.map(q).join(';')).join('\r\n');
}

function drawBarcode(svgId, code){
  try { JsBarcode('#'+svgId, code, {format:'CODE128', height:46, displayValue:true, fontSize:12, margin:2, width:1.5}); }
  catch(e){ const el = document.getElementById(svgId); if(el) el.outerHTML = `<div class="mono text-xs">${esc(code)}</div>`; }
}
function drawQR(elId, text, size){
  const el = document.getElementById(elId); if(!el) return; el.innerHTML = '';
  try { new QRCode(el, {text, width:size, height:size, correctLevel:QRCode.CorrectLevel.M}); }
  catch(e){ el.textContent = 'QR belum termuat'; }
}
const qrText = a => 'KODE: '+a.code+'\nBARANG: '+itemTitle(a)+'\nSN: '+a.serial;

}
function labelsDraw(list, pf){ list.forEach((a,i) => { drawBarcode(pf+'bc'+i, a.code); drawQR(pf+'qr'+i, qrText(a), 72); }); }

function pfPreview(){

function savePurchase(){
  const d = {orgId:val('f_org'), catId:val('f_cat'), brand:val('f_brand').trim(), type:val('f_type').trim(), serial:val('f_serial').trim(), spec:val('f_spec').trim(), image:val('f_img'),
    vendorId:val('f_vendor'), buyDate:val('f_date'), price:moneyVal('f_price'), invoice:val('f_invoice').trim(), warrantyValue:+val('f_wval') || 0, warrantyUnit:val('f_wunit'),
    depMonths:+val('f_dep') || 0, condition:val('f_cond'), submitterId:val('f_emp'), note:val('f_note').trim(), proof:TMP.proof || null};
  const miss = [['orgId','Organisasi'],['catId','Kategori'],['brand','Brand'],['type','Tipe barang'],['serial','Serial number'],['vendorId','Vendor'],['buyDate','Tanggal beli'],['invoice','Nomor faktur'],['submitterId','Karyawan pengaju']].find(x => !d[x[0]]);
  if(miss){ toast(miss[1]+' wajib diisi.','error'); return; }
  if(d.price <= 0){ toast('Harga beli harus lebih dari 0.','error'); return; }
  if(d.price >= MIN_DEP_PRICE && d.depMonths < 1){ toast('Masa penyusutan minimal 1 bulan untuk harga ≥ Rp 500.000.','error'); return; }
  if(d.price < MIN_DEP_PRICE) d.depMonths = 0;
  const p = EDIT_PUR ? byId(DB.purchases, EDIT_PUR) : null;
  if(DB.assets.some(a => a.serial.toLowerCase() === d.serial.toLowerCase() && (!p || a.id !== p.assetId))){ toast('Serial number sudah terdaftar pada aset lain.','error'); return; }
  if(p){
    const a = byId(DB.assets, p.assetId), emp = byId(DB.employees, d.submitterId);
    Object.assign(a, {brand:d.brand, type:d.type, serial:d.serial, spec:d.spec, image:d.image, vendorId:d.vendorId, buyDate:d.buyDate, price:d.price, invoice:d.invoice, warrantyValue:d.warrantyValue, warrantyUnit:d.warrantyUnit, depMonths:d.depMonths, condition:d.condition, note:d.note});
    Object.assign(p, {submitterId:d.submitterId, dept:emp.dept, position:emp.position, proof:d.proof});
    log('Mengubah pembelian '+a.code); toast('Pembelian '+a.code+' diperbarui.');
  } else {
    const a = createPurchase(d);
    log('Pembelian baru '+a.code+' ('+itemTitle(a)+') masuk ke stok'); toast('Tersimpan: '+a.code+' — otomatis masuk ke Stok Aset.');
  }
  EDIT_PUR = null; save(); closeModal(); render();
}

function initSigPad(){
  const c = $('#sigCanvas'); if(!c) return;
  const ctx = c.getContext('2d'); ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111c2b';
  let drawing = false, last = null;
  const pos = e => { const r = c.getBoundingClientRect(); return {x:(e.clientX - r.left)*c.width/r.width, y:(e.clientY - r.top)*c.height/r.height}; };
  c.addEventListener('pointerdown', e => { drawing = true; last = pos(e); try { c.setPointerCapture(e.pointerId); } catch(_){} e.preventDefault(); });
  c.addEventListener('pointermove', e => { if(!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last = p; TMP.sigDirty = true; TMP.receipt = null; });
  const end = () => { drawing = false; };
  c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
}
function clearSig(){ const c = $('#sigCanvas'); if(c){ c.getContext('2d').clearRect(0,0,c.width,c.height); } TMP.sigDirty = false; TMP.receipt = null; const n = $('#rc_name'); if(n) n.textContent = 'Tanda tangan dihapus.'; }
function pickReceipt(input){ const f = input.files[0]; if(!f) return; fileObjFrom(f, o => { TMP.receipt = o; TMP.sigDirty = false; const c = $('#sigCanvas'); if(c) c.getContext('2d').clearRect(0,0,c.width,c.height); $('#rc_name').textContent = 'Terpilih: '+o.name; }); }
function saveLoan(){
  const empId = val('ln_emp'), assetId = val('ln_asset'), location = val('ln_loc').trim(), room = val('ln_room').trim(), loanDate = val('ln_date');
  if(!empId){ toast('Pilih karyawan peminjam.','error'); return; }
  if(!assetId){ toast('Pilih kode barang.','error'); return; }
  if(!location || !room){ toast('Lokasi dan ruangan wajib diisi.','error'); return; }
  if(!loanDate){ toast('Tanggal pinjam wajib diisi.','error'); return; }
  if(activeLoan(assetId)){ toast('Aset ini sudah dipinjam.','error'); return; }
  if(inService(assetId)){ toast('Aset sedang Dalam Perbaikan dan tidak dapat dipinjam.','error'); return; }
  let receipt = TMP.receipt || null;
  if(!receipt && TMP.sigDirty){ receipt = {name:'tanda-tangan.png', mime:'image/png', data:$('#sigCanvas').toDataURL('image/png')}; }
  const l = createLoan({assetId, empId, location, room, handedBy:val('ln_by'), receipt, note:val('ln_note').trim(), loanDate});
  const a = byId(DB.assets, assetId);
  if(!DB.locations.some(x => x.location.toLowerCase() === location.toLowerCase() && x.room.toLowerCase() === room.toLowerCase())) DB.locations.push({id:uid('loc_'), location, room});
  log(a.code+' dipinjam oleh '+l.empName); save(); closeModal(); render(); toast(a.code+' dipinjam '+l.empName+' — keluar dari Stok Aset.');

function setMasterTab(k){ UI.tab.master = k; UI.q.master = ''; render(); }
function masterForm(type, id){
  if(!guard()) return; const M = MASTERS[type], x = id ? byId(DB[M.key], id) : {};
  const body = `<div class="space-y-3">${M.fields.map(f => fld(f.l, f.type === 'select'

function masterSave(type, id){
  const M = MASTERS[type], d = {};
  for(const f of M.fields){
    let v = val('mf_'+f.k).trim(); if(f.code) v = v.toUpperCase();
    if(f.req && !v){ toast(f.l+' wajib diisi.','error'); return; }
    if(f.code && !/^[A-Z0-9-]+$/.test(v)){ toast('Kode hanya boleh huruf, angka, dan tanda hubung (tanpa spasi atau "/").','error'); return; }
    d[f.k] = v;
  }
  const codeF = M.fields.find(f => f.code);
  if(codeF && DB[M.key].some(x => x[codeF.k] === d[codeF.k] && x.id !== id)){ toast('Kode '+d[codeF.k]+' sudah digunakan.','error'); return; }
  if(id){ Object.assign(byId(DB[M.key], id), d); }
  else DB[M.key].push({id:uid(type.slice(0,3)+'_'), ...d});
  log((id ? 'Mengubah ' : 'Menambah ')+M.label.toLowerCase()+': '+(d.name || d.location)); save(); closeModal(); render(); toast('Data tersimpan.');
}
function masterDel(type, id){
  if(!guardDel()) return; const M = MASTERS[type], x = byId(DB[M.key], id);
  if(M.used(x)){ toast('Data ini masih digunakan oleh transaksi/data lain dan tidak dapat dihapus.','error'); return; }
  confirmBox(`Hapus <b>${esc(x.name || x.location)}</b>?`, () => { DB[M.key] = DB[M.key].filter(y => y.id !== id); log('Menghapus '+M.label.toLowerCase()+': '+(x.name || x.location)); save(); render(); toast('Data dihapus.'); }, {danger:true, ok:'Hapus'});
}

function userForm(id){
  if(!guardSA()) return; const u = id ? byId(DB.users,id) : {name:'',username:'',role:'Staff'};

    ${fld(id ? 'Password baru' : 'Password', `<input id="us_pass" type="password" class="input" autocomplete="new-password" placeholder="${id ? 'Kosongkan bila tidak diubah' : 'Minimal 6 karakter'}">`, '', !id, id ? 'Isi hanya untuk mereset password user ini.' : 'Minimal 6 karakter.')}</div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="userSave('${id || ''}')">Simpan</button>`, 'max-w-md');

function userSave(id){
  if(!guardSA()) return; const d = {name:val('us_name').trim(), username:val('us_user').trim().toLowerCase(), role:val('us_role')}, pw = val('us_pass');
  if(!d.name || !d.username){ toast('Nama dan username wajib diisi.','error'); return; }
  if(!/^[a-z0-9._-]+$/.test(d.username)){ toast('Username hanya boleh huruf kecil, angka, titik, garis bawah, dan tanda hubung.','error'); return; }
  if(DB.users.some(x => x.username === d.username && x.id !== id)){ toast('Username sudah digunakan.','error'); return; }
  if((!id || pw) && pw.length < 6){ toast('Password minimal 6 karakter.','error'); return; }
  if(id){ const u = byId(DB.users,id); if(u.role === 'Super Admin' && d.role !== 'Super Admin' && DB.users.filter(x => x.role === 'Super Admin').length === 1){ toast('Harus ada minimal satu Super Admin.','error'); return; } Object.assign(u, d); if(pw) u.passHash = hashPw(pw); }
  else DB.users.push({id:uid('usr_'), ...d, passHash:hashPw(pw)});
  log((id ? 'Mengubah' : 'Menambah')+' user '+d.name); save(); closeModal(); render(); toast('User tersimpan.');
}
function userDel(id){
  if(!guardSA()) return; const u = byId(DB.users,id);
  if(id === DB.session.userId || id === DB.session.realUserId){ toast('Anda tidak dapat menghapus user yang sedang aktif.','error'); return; }
  if(u.role === 'Super Admin' && DB.users.filter(x => x.role === 'Super Admin').length === 1){ toast('Harus ada minimal satu Super Admin.','error'); return; }
  confirmBox(`Hapus user <b>${esc(u.name)}</b>?`, () => { DB.users = DB.users.filter(x => x.id !== id); log('Menghapus user '+u.name); save(); render(); toast('User dihapus.'); }, {danger:true, ok:'Hapus'});
}

function reportData(kind){
  if(kind === 'dep'){
    const fo = UI.f.repOrg || '';
    const list = DB.assets.filter(a => !fo || a.orgId === fo).sort((a,b) => a.code.localeCompare(b.code));
    let tp = 0, ta = 0, tb = 0; const rows = [], csv = [];
    list.forEach((a,i) => { const d = depInfo(a); tp += +a.price; ta += d.accum; tb += d.book;
      rows.push([i+1, a.code, itemTitle(a), orgName(a.orgId), fmtD(a.buyDate), idr(a.price), d.life, d.period, idr(d.monthly), idr(d.accum), idr(d.book)]);
      csv.push([i+1, a.code, itemTitle(a), orgName(a.orgId), a.buyDate, Math.round(a.price), d.life, d.period, Math.round(d.monthly), Math.round(d.accum), Math.round(d.book)]); });
    return {title:'Laporan Nilai Buku & Penyusutan Aset', sub: fo ? 'Organisasi: '+orgName(fo) : 'Semua organisasi', file:'laporan-penyusutan-aset',
      head:['No','Kode barang','Nama barang','Organisasi','Tgl beli','Harga perolehan','Masa (bln)','Periode','Susut / bln','Akumulasi susut','Nilai buku'],
      rows, csv, foot:['','','','','Total', idr(tp),'','','', idr(ta), idr(tb)], right:[5,6,7,8,9,10]};
  }
  if(kind === 'loans'){
    const fs = UI.f.repLoanStatus || '', from = UI.f.repFrom || '', to = UI.f.repTo || '';
    const list = DB.loans.map(l => ({l, a:byId(DB.assets,l.assetId)})).filter(x => x.a)
      .filter(x => (!fs || x.l.status === fs) && (!from || x.l.loanDate >= from) && (!to || x.l.loanDate <= to)).sort((x,y) => y.l.loanDate.localeCompare(x.l.loanDate));
    const rows = [], csv = [];
    list.forEach(({l,a},i) => { const end = l.returnDate || todayStr(); const days = Math.max(0, Math.round((parseDate(end) - parseDate(l.loanDate))/86400000));
      rows.push([i+1, a.code, itemTitle(a), l.empName, orgName(l.orgId), l.dept, l.location+' / '+l.room, fmtD(l.loanDate), l.returnDate ? fmtD(l.returnDate) : '-', days+' hari', l.status === 'active' ? 'Dipinjam' : 'Dikembalikan', l.handedBy]);
      csv.push([i+1, a.code, itemTitle(a), l.empName, orgName(l.orgId), l.dept, l.location, l.room, l.loanDate, l.returnDate || '', days, l.status === 'active' ? 'Dipinjam' : 'Dikembalikan', l.handedBy]); });
    return {title:'Laporan Riwayat Peminjaman & Pengembalian', sub:'Periode: '+(from ? fmtD(from) : 'awal')+' s.d. '+(to ? fmtD(to) : 'sekarang')+(fs ? ' · Status: '+(fs === 'active' ? 'Dipinjam' : 'Dikembalikan') : ''), file:'laporan-peminjaman',
      head:['No','Kode barang','Nama barang','Peminjam','Organisasi','Departemen','Lokasi / ruangan','Tgl pinjam','Tgl kembali','Durasi','Status','Diserahkan oleh'], rows, csv,
      csvHead:['No','Kode barang','Nama barang','Peminjam','Organisasi','Departemen','Lokasi','Ruangan','Tgl pinjam','Tgl kembali','Durasi (hari)','Status','Diserahkan oleh'], foot:null, right:[]};
  }
  const g = UI.f.repGroup || 'org'; const groups = {};
  DB.assets.forEach(a => {
    const l = activeLoan(a.id);
    const key = g === 'org' ? orgName(a.orgId) : g === 'cat' ? catName(a) : (l ? l.location : (activePlacement(a.id) ? activePlacement(a.id).location : 'Gudang / stok'));
    const o = groups[key] = groups[key] || {n:0, price:0, accum:0, book:0, loan:0, svc:0}; const d = depInfo(a);
    o.n++; o.price += +a.price; o.accum += d.accum; o.book += d.book; if(l) o.loan++; if(inService(a.id)) o.svc++;
  });
  const keys = Object.keys(groups).sort(); const T = {n:0, price:0, accum:0, book:0, loan:0, svc:0};
  const rows = [], csv = [];
  keys.forEach(k => { const o = groups[k]; Object.keys(T).forEach(t => T[t] += o[t]);
    rows.push([k, o.n, idr(o.price), idr(o.accum), idr(o.book), o.loan, o.svc]); csv.push([k, o.n, Math.round(o.price), Math.round(o.accum), Math.round(o.book), o.loan, o.svc]); });
  const gl = g === 'org' ? 'Organisasi' : g === 'cat' ? 'Kategori' : 'Lokasi';
  return {title:'Laporan Aset Berdasarkan '+gl, sub:'Aset dipinjam mengikuti lokasi peminjaman, aset tetap mengikuti lokasi penempatan, dan aset di stok dicatat sebagai Gudang / stok', file:'laporan-aset-per-'+g,
    head:[gl,'Jumlah aset','Total harga perolehan','Akumulasi penyusutan','Nilai buku','Dipinjam','Dalam service'], rows, csv,
    foot:['Total', T.n, idr(T.price), idr(T.accum), idr(T.book), T.loan, T.svc], right:[1,2,3,4,5,6]};
}
function reportTable(r, cls){
  const R = i => r.right.includes(i) ? ' class="r"' : '';
  return `<table class="${cls}"><thead><tr>${r.head.map((h,i) => `<th${R(i)}>${esc(h)}</th>`).join('')}</tr></thead><tbody>${r.rows.map(row => `<tr>${row.map((c,i) => `<td${R(i)}>${esc(c)}</td>`).join('')}</tr>`).join('') || emptyRow(r.head.length,'Tidak ada data untuk filter ini.')}</tbody>${r.foot ? `<tfoot><tr>${r.foot.map((c,i) => `<td${R(i)}>${esc(c)}</td>`).join('')}</tr></tfoot>` : ''}</table>`;
}

  return `${tabsHtml([['dep','Nilai buku & penyusutan'],['loans','Peminjaman & pengembalian'],['group','Aset per organisasi / kategori / lokasi']], tab, 'setRepTab')}
  <div class="flex flex-wrap items-center gap-2 mb-4">${filters}<div class="flex-1"></div><button class="btn btn-ghost" onclick="exportReportCSV()"><i class="fa-solid fa-file-csv"></i>Export Excel (CSV)</button><button class="btn btn-primary" onclick="printReport()"><i class="fa-solid fa-file-pdf"></i>Cetak / simpan PDF</button></div>
  <div class="card overflow-hidden"><div class="px-4 py-3 border-b border-slate-200"><div class="font-bold text-ink">${esc(r.title)}</div><div class="text-xs text-slate-500">${esc(r.sub)}</div></div><div class="overflow-x-auto">${reportTable(r,'tbl')}</div></div>`;
};

function exportReportCSV(){ const r = reportData(UI.tab.reports); download(r.file+'-'+todayStr()+'.csv', toCSV(r.csvHead || r.head, r.csv), 'text/csv;charset=utf-8'); toast('File CSV berhasil dibuat.'); }

function exportJSON(){ download('katamata-backup-'+todayStr()+'.json', JSON.stringify(DB, null, 2), 'application/json'); log('Backup data diunduh'); save(); toast('Backup JSON berhasil diunduh.'); }
function importJSON(input){
  if(!guardSA()) return; const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result); if(!validDB(d)) throw new Error('struktur file backup tidak valid');
      confirmBox(`Restore dari <b>${esc(f.name)}</b>? Seluruh data saat ini (${DB.assets.length} aset) akan diganti dengan ${d.assets.length} aset dari file.${SYNC.enabled ? ' Data di Google Sheets juga akan tertimpa.' : ''}`, () => {
        normalizeDB(d); ensurePasswords(d); const keep = realUser().id; DB = d;
        DB.session = byId(d.users, keep) ? {userId:keep, realUserId:keep} : {userId:null, realUserId:null};
        log('Restore data dari file JSON'); save(); render(); toast('Data berhasil di-restore.');
      }, {ok:'Ya, restore', danger:true, title:'Restore data'});
    } catch(e){ toast('Gagal import: '+e.message,'error'); }
    input.value = '';
  };
  r.readAsText(f);
}

}
function loginError(msg){ const e = $('#lg_err'); if(e){ e.textContent = msg; e.classList.remove('hidden'); } }
function togglePass(){ const i = $('#lg_pass'), e = $('#lg_eye'); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; e.className = 'fa-solid '+(show ? 'fa-eye-slash' : 'fa-eye'); }
function fillDemo(id){ const u = byId(DB.users,id); if(!u) return; $('#lg_user').value = u.username; $('#lg_pass').value = defaultPw(u.role); const e = $('#lg_err'); if(e) e.classList.add('hidden'); $('#lg_pass').focus(); }
function doLogin(e){
  if(e) e.preventDefault();
  const now = Date.now();
  if(now < LOGIN_LOCK){ loginError('Terlalu banyak percobaan. Coba lagi dalam '+Math.ceil((LOGIN_LOCK-now)/1000)+' detik.'); return false; }
  const un = val('lg_user').trim().toLowerCase(), pw = val('lg_pass');
  if(!un || !pw){ loginError('Username dan password wajib diisi.'); return false; }
  const u = DB.users.find(x => x.username === un);
  if(!u || u.passHash !== hashPw(pw)){
    LOGIN_FAILS++;
    if(LOGIN_FAILS >= 5){ LOGIN_FAILS = 0; LOGIN_LOCK = now + 30000; loginError('Terlalu banyak percobaan gagal. Login dikunci selama 30 detik.'); }
    else loginError('Username atau password salah.');
    return false;
  }
  LOGIN_FAILS = 0; DB.session = {userId:u.id, realUserId:u.id}; UI.view = 'dashboard';
  log('Login ke sistem'); save(); render(); toast('Selamat datang, '+u.name+'.');
  return false;
}
function logout(){
  log('Keluar dari sistem'); DB.session = {userId:null, realUserId:null}; save(); closeModal(); closeConfirm(); UI.view = 'dashboard'; render(); toast('Anda telah keluar.');
}

  showModal('Ubah password', `<div class="space-y-3">${fld('Password saat ini', `<input id="pw_old" type="password" class="input" autocomplete="current-password">`, '', true)}${fld('Password baru', `<input id="pw_new" type="password" class="input" autocomplete="new-password">`, '', true, 'Minimal 6 karakter.')}${fld('Ulangi password baru', `<input id="pw_new2" type="password" class="input" autocomplete="new-password">`, '', true)}</div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="savePassword()">Simpan password</button>`, 'max-w-md');
}
function savePassword(){
  const u = realUser();
  if(u.passHash !== hashPw(val('pw_old'))){ toast('Password saat ini salah.','error'); return; }
  const n = val('pw_new');
  if(n.length < 6){ toast('Password baru minimal 6 karakter.','error'); return; }

  u.passHash = hashPw(n); log('Mengubah password sendiri'); save(); closeModal(); toast('Password berhasil diubah.');
}

/* =====================================================================
   SINKRONISASI GOOGLE SHEETS (via Google Apps Script Web App)
   ===================================================================== */
const SYNC_KEY = 'asetku_sync_v1';
const COLLECTIONS = ['orgs','categories','employees','vendors','locations','users','purchases','assets','loans','services','placements','activity'];
const SYNC = Object.assign({url:'', token:'', enabled:false, rev:0, last:0}, (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch(e){ return {}; } })());
SYNC.status = SYNC.enabled ? 'idle' : 'off'; SYNC.error = ''; SYNC.known = new Set(); SYNC.conflictRev = 0;
let pushTimer = null, pushing = false, pushDirty = false, pollTimer = null;
function saveSyncCfg(){ try { localStorage.setItem(SYNC_KEY, JSON.stringify({url:SYNC.url, token:SYNC.token, enabled:SYNC.enabled, rev:SYNC.rev, last:SYNC.last, wasOutdated:SYNC.wasOutdated})); } catch(e){} }

/* gambar / berkas besar dipisah ke sheet "_files" (batas sel Sheets 50.000 karakter) */
function djb(s){ let h = 5381, g = 52711; for(let i = 0; i < s.length; i++){ const c = s.charCodeAt(i); h = ((h << 5) + h + c)|0; g = (Math.imul(g,33) ^ c)|0; } return (h>>>0).toString(36)+(g>>>0).toString(36); }
const _fileIds = new Map();
function fileId(s){ let id = _fileIds.get(s); if(!id){ id = '@file:'+djb(s)+'-'+s.length; _fileIds.set(s,id); } return id; }
function extractFiles(db){
  const files = {};
  const walk = o => {
    if(Array.isArray(o)) return o.map(walk);
    if(o && typeof o === 'object'){ const r = {}; for(const k in o) r[k] = walk(o[k]); return r; }
    if(typeof o === 'string' && o.length > 2000 && o.startsWith('data:')){ const id = fileId(o); files[id] = o; return id; }
    return o;
  };
  const data = {}; COLLECTIONS.forEach(c => { data[c] = walk(db[c] || []); });
  return {data, files};
}
function hydrate(o, files){
  if(Array.isArray(o)) return o.map(x => hydrate(x, files));
  if(o && typeof o === 'object'){ const r = {}; for(const k in o) r[k] = hydrate(o[k], files); return r; }
  if(typeof o === 'string' && o.startsWith('@file:')) return files[o] || '';
  return o;
}
async function sheetsCall(payload, cfg){
  cfg = cfg || SYNC;
  const res = await fetch(cfg.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({token:cfg.token}, payload))});
  if(!res.ok) throw new Error('HTTP '+res.status);
  let j; try { j = await res.json(); } catch(e){ throw new Error('respons bukan JSON, periksa URL /exec dan akses "Anyone"'); }
  if(j && j.ok && cfg === SYNC){
    const sup = Array.isArray(j.collections) && j.collections.includes('placements');
    SYNC.outdated = !sup;
    if(!sup){ SYNC.wasOutdated = true; if(!SYNC._warned){ SYNC._warned = true; toast('Code.gs di Apps Script belum versi terbaru: data "Lokasi Aset Tetap" belum tersimpan ke Google Sheets. Perbarui kode lalu buat New version.','error'); } }
  }
  return j;
}
async function pullFromSheets(){
  const r = await sheetsCall({action:'pull'});
  if(!r.ok) throw new Error(r.error || 'gagal menarik data');
  if(!r.rev || !((r.data.users || []).length)) return {empty:true, rev:r.rev || 0};
  const files = r.files || {}, nd = {version:1, session:DB.session || {userId:null, realUserId:null}};
  const sup = Array.isArray(r.collections) && r.collections.includes('placements');
  let keepPl = null; // lindungi data Lokasi Aset Tetap lokal bila server belum mendukung / baru ditingkatkan
  if(!sup) keepPl = DB.placements || [];
  else if(SYNC.wasOutdated && !((r.data.placements || []).length) && (DB.placements || []).length) keepPl = DB.placements;
  COLLECTIONS.forEach(c => { nd[c] = (c === 'placements' && keepPl) ? keepPl : hydrate(r.data[c] || [], files); });
  if(!validDB(nd)) throw new Error('struktur data di Sheets tidak valid');
  normalizeDB(nd); ensurePasswords(nd); DB = nd;
  if(!byId(DB.users, DB.session.userId)) DB.session = {userId:null, realUserId:null};
  SYNC.rev = r.rev; SYNC.known = new Set(Object.keys(files)); SYNC.last = Date.now(); SYNC.status = 'ok'; SYNC.error = '';
  if(sup) SYNC.wasOutdated = false;
  saveSyncCfg(); saveLocal();
  if(sup && keepPl) schedulePush();
  return {empty:false, rev:r.rev};
}
function schedulePush(){
  if(!SYNC.enabled || !SYNC.url) return;
  SYNC.status = 'pending'; updateSyncBadge();
  clearTimeout(pushTimer); pushTimer = setTimeout(() => { pushTimer = null; doPush(); }, 1200);
}
async function doPush(){
  if(pushing){ pushDirty = true; return; }
  pushing = true; SYNC.status = 'syncing'; updateSyncBadge();
  try {
    const {data, files} = extractFiles(DB), nf = {};
    Object.keys(files).forEach(id => { if(!SYNC.known.has(id)) nf[id] = files[id]; });
    const r = await sheetsCall({action:'push', baseRev:SYNC.rev, data, files:nf, keepFiles:Object.keys(files), user:(realUser() || {}).name || ''});
    if(r.ok){ SYNC.rev = r.rev; SYNC.known = new Set(Object.keys(files)); SYNC.status = 'ok'; SYNC.error = ''; SYNC.last = Date.now(); saveSyncCfg(); }
    else if(r.conflict){ SYNC.status = 'conflict'; SYNC.conflictRev = r.rev; pushDirty = false; showConflict(); }
    else { SYNC.status = 'error'; SYNC.error = r.error || 'gagal menyimpan'; }
  } catch(e){ SYNC.status = 'error'; SYNC.error = 'tidak dapat terhubung ('+e.message+')'; }
  pushing = false;
  if(pushDirty && SYNC.status !== 'conflict'){ pushDirty = false; schedulePush(); }
  updateSyncBadge();
}
function showConflict(){
  showModal('Konflik data', `<p class="text-sm text-slate-600">Data di Google Sheets telah diubah oleh pengguna lain sejak sinkronisasi terakhir Anda. Pilih tindakan:</p>
    <ul class="text-sm text-slate-600 list-disc pl-5 mt-2 space-y-1"><li><b>Muat data terbaru</b>: perubahan terakhir Anda di perangkat ini dibuang.</li><li><b>Timpa Sheets</b>: data di perangkat ini menggantikan data di Google Sheets.</li></ul>`,
    `<button class="btn btn-ghost" onclick="resolveConflict('pull')">Muat data terbaru</button><button class="btn btn-danger" onclick="resolveConflict('push')">Timpa Sheets dengan data saya</button>`, 'max-w-lg');
}
async function resolveConflict(mode){
  closeModal();
  try {
    if(mode === 'pull'){ await pullFromSheets(); render(); toast('Data terbaru dimuat dari Google Sheets.'); }
    else { SYNC.rev = SYNC.conflictRev; await doPush(); render(); if(SYNC.status === 'ok') toast('Google Sheets diperbarui dengan data Anda.'); }
  } catch(e){ SYNC.status = 'error'; SYNC.error = e.message; toast('Gagal: '+e.message,'error'); updateSyncBadge(); }
}
async function syncNow(){
  if(!SYNC.enabled) return;
  try {
    if(pushTimer || SYNC.status === 'error'){ clearTimeout(pushTimer); pushTimer = null; await doPush(); if(SYNC.status !== 'ok'){ if(SYNC.status === 'error') toast('Sinkronisasi gagal: '+SYNC.error,'error'); return; } }
    const r = await sheetsCall({action:'ping'}); if(!r.ok) throw new Error(r.error);
    if(r.rev > SYNC.rev){ await pullFromSheets(); render(); toast('Data diperbarui dari Google Sheets.'); }
    else { SYNC.status = 'ok'; toast('Data sudah sinkron dengan Google Sheets.'); updateSyncBadge(); }
  } catch(e){ SYNC.status = 'error'; SYNC.error = e.message; toast('Sinkronisasi gagal: '+e.message,'error'); updateSyncBadge(); }
}
function startPolling(){
  clearInterval(pollTimer); if(!SYNC.enabled) return;
  pollTimer = setInterval(async () => {
    if(!SYNC.enabled || pushing || pushTimer || $('#modalRoot').innerHTML || $('#confirmRoot').innerHTML) return;
    if(SYNC.status === 'error'){ doPush(); return; }
    if(SYNC.status !== 'ok') return;
    try {
      const r = await sheetsCall({action:'ping'});
      if(r.ok && r.rev > SYNC.rev){ await pullFromSheets(); render(); toast('Data diperbarui dari Google Sheets.'); }
    } catch(e){ SYNC.status = 'error'; SYNC.error = 'offline'; updateSyncBadge(); }
  }, 30000);
}
function syncStatusBase(){
  const t = SYNC.last ? ' · terakhir '+fmtDT(SYNC.last) : '';
  if(!SYNC.enabled) return '<span class="badge b-gray">Nonaktif</span> Data hanya tersimpan di browser ini.';
  if(SYNC.status === 'ok') return '<span class="badge b-green"><i class="fa-solid fa-check"></i>Tersinkron</span>'+t;
  if(SYNC.status === 'pending' || SYNC.status === 'syncing' || SYNC.status === 'idle') return '<span class="badge b-amber">Menyimpan…</span>';
  if(SYNC.status === 'conflict') return '<span class="badge b-red">Konflik data</span>';
  return '<span class="badge b-red">Gagal</span> '+esc(SYNC.error || '');
}
function syncStatusHTML(){
  return syncStatusBase() + (SYNC.enabled && SYNC.outdated ? '<div class="text-xs mt-1" style="color:#8f4f07">Code.gs di Apps Script belum versi terbaru: data Lokasi Aset Tetap hanya tersimpan lokal. Perbarui kode lalu buat New version.</div>' : '');
}
function updateSyncBadge(noRe){
  const el = $('#syncBadge');
  if(el){
    const M = {off:['fa-database','#8a97a8','Data lokal (LocalStorage)'], ok:['fa-circle-check','#7ee0a5','Google Sheets · tersinkron'], idle:['fa-circle-notch','#f5c26b','Google Sheets · menghubungkan…'],
      pending:['fa-cloud-arrow-up','#f5c26b','Menyimpan ke Google Sheets…'], syncing:['fa-cloud-arrow-up','#f5c26b','Menyimpan ke Google Sheets…'],
      conflict:['fa-triangle-exclamation','#ff9a8f','Konflik data — klik untuk atur'], error:['fa-circle-exclamation','#ff9a8f','Gagal sinkron — klik untuk coba lagi']};
    let m = M[SYNC.enabled ? SYNC.status : 'off'] || M.off;
    if(SYNC.enabled && SYNC.outdated && SYNC.status === 'ok') m = ['fa-triangle-exclamation','#f5c26b','Sheets: perbarui Code.gs'];
    el.innerHTML = `<i class="fa-solid ${m[0]} mr-1.5" style="color:${m[1]}"></i>${m[2]}`;
  }
  if(!noRe && UI.view === 'backup' && currentUser() && !$('#modalRoot').innerHTML) render();
}
function syncBadgeClick(){
  if(!SYNC.enabled){ if(isSA()) openSyncForm(); else toast('Data disimpan lokal di browser. Hubungi Super Admin untuk mengaktifkan Google Sheets.'); return; }
  if(SYNC.status === 'conflict') showConflict();
  else if(SYNC.status === 'error') syncNow();
  else if(isSA()) openSyncForm();
  else toast('Status: '+(SYNC.status === 'ok' ? 'tersinkron dengan Google Sheets' : 'sedang menyimpan'));
}
function syncDesc(){
  return syncStatusHTML()+'<br><span class="block mt-2">'+(SYNC.enabled
    ? 'Setiap perubahan otomatis tersimpan ke Google Sheets Anda dan dibagikan ke semua pengguna (diperiksa tiap 30 detik).'
    : 'Simpan data di Google Sheets agar bisa dipakai bersama dari banyak perangkat, dan dapat dilihat langsung di spreadsheet.')+'</span>';
}
function syncBtns(){
  return `<div class="flex flex-wrap gap-2">${SYNC.enabled ? `<button class="btn btn-primary" onclick="syncNow()"><i class="fa-solid fa-rotate"></i>Sinkronkan sekarang</button>` : ''}${isSA() ? `<button class="btn btn-ghost" onclick="openSyncForm()"><i class="fa-solid fa-gear"></i>Pengaturan</button>` : ''}<button class="btn btn-ghost" onclick="showSetupGuide()"><i class="fa-solid fa-circle-question"></i>Panduan setup</button></div>`;
}
function openSyncForm(){
  if(currentUser() && !isSA()){ toast('Hanya Super Admin yang dapat mengatur Google Sheets.','error'); return; }
  const on = SYNC.enabled;
  showModal('Google Sheets sebagai database', `<div class="rounded-lg p-3 mb-4 text-sm" style="background:#f6f8fa;border:1px solid var(--line)">${syncStatusHTML()}</div>
    <div class="space-y-3">${fld('URL Web App (Apps Script)', `<input id="sy_url" class="input mono" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(SYNC.url)}">`, '', true)}
    ${fld('Token rahasia', `<input id="sy_token" type="text" class="input mono" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(TMP.genToken || SYNC.token || '')}">`, '', true, 'Harus sama dengan nilai SECRET di script Apps Script.')}</div>
    <div id="sy_diag" class="text-sm mt-3"></div><div class="flex flex-wrap gap-2 mt-3"><button class="btn btn-primary btn-sm" onclick="diagnoseSheets()"><i class="fa-solid fa-stethoscope"></i>Diagnosa koneksi</button><button class="btn btn-ghost btn-sm" onclick="showSetupGuide()"><i class="fa-solid fa-circle-question"></i>Panduan setup &amp; kode Apps Script</button>${on ? `<button class="btn btn-ghost btn-sm" onclick="copyInviteLink()"><i class="fa-solid fa-link"></i>Salin link undangan</button>` : ''}</div>`,
    `${on ? `<button class="btn btn-danger" onclick="disconnectSheets()">Putuskan</button>` : ''}<button class="btn btn-ghost" onclick="closeModal()">Tutup</button><button class="btn btn-primary" onclick="connectSheets()"><i class="fa-solid fa-plug"></i>${on ? 'Simpan &amp; uji ulang' : 'Hubungkan'}</button>`, 'max-w-xl');
}
async function diagnoseSheets(){
  const url = val('sy_url').trim(), token = val('sy_token').trim(), box = $('#sy_diag');
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)){ toast('URL harus berupa Web App Apps Script yang berakhiran /exec.','error'); return; }
  if(!token){ toast('Isi token terlebih dahulu.','error'); return; }
  box.innerHTML = '<div class="rounded-lg p-3" style="background:#f6f8fa;border:1px solid var(--line)"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i>Memeriksa…</div>';
  let ok = false, msg;
  try {
    const res = await fetch(url+'?check='+encodeURIComponent(token));
    let j; try { j = await res.json(); } catch(e){ throw new Error('Respons bukan JSON. Akses Web App belum "Anyone", atau URL bukan versi /exec.'); }
    if(j.tokenMatch === undefined) msg = 'Server terjangkau, tetapi masih memakai <b>kode Apps Script lama</b>. Tempel Code.gs terbaru, lalu Deploy → Manage deployments → ikon pensil → Version: <b>New version</b> → Deploy.';
    else if(j.tokenMatch && j.secretStillDefault){ ok = true; msg = 'Token cocok, tetapi script masih memakai token bawaan yang tidak aman. Ganti nilai SECRET, simpan, lalu buat New version.'; }
    else if(j.tokenMatch){ ok = true; msg = 'Token <b>cocok</b>. Klik <b>Hubungkan</b>.'; }
    else if(j.secretStillDefault) msg = 'Token tidak cocok karena deployment <b>masih memakai SECRET bawaan</b> (GANTI_TOKEN_RAHASIA). Kemungkinan besar Anda sudah mengubah SECRET tetapi belum membuat <b>New version</b>: Deploy → Manage deployments → ikon pensil → Version: New version → Deploy.';
    else if(j.secretHasEdgeSpace) msg = 'Token tidak cocok. Nilai SECRET di script memiliki <b>spasi di awal atau akhir</b>. Hapus spasinya, simpan, lalu buat New version.';
    else msg = 'Server aktif tetapi token tidak cocok. Periksa: (1) nilai SECRET di script sama persis dengan token di sini, huruf besar/kecil berpengaruh; (2) setelah mengubah SECRET sudah <b>New version</b>; (3) tanda kutip di script adalah kutip lurus \'...\'.';
    if(j.tokenMatch !== undefined && !(Array.isArray(j.collections) && j.collections.includes('placements'))) msg += '<br><b>Catatan:</b> Code.gs di Apps Script belum versi terbaru (belum mendukung Lokasi Aset Tetap). Tempel kode terbaru lalu buat New version.';
  } catch(e){ msg = esc(e.message === 'Failed to fetch' ? 'Tidak dapat menjangkau server (internet putus, ad-blocker, atau URL salah).' : e.message); }
  box.innerHTML = `<div class="rounded-lg p-3 flex gap-2" style="background:${ok ? '#e4f6ec' : '#fdeceb'};border:1px solid ${ok ? '#b6e3c8' : '#f3c3bf'}"><i class="fa-solid ${ok ? 'fa-circle-check' : 'fa-circle-xmark'} mt-0.5" style="color:${ok ? '#0d6b3f' : '#b42318'}"></i><div>${msg}</div></div>`;
}
async function connectSheets(){
  const url = val('sy_url').trim(), token = val('sy_token').trim();
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)){ toast('URL harus berupa Web App Apps Script yang berakhiran /exec.','error'); return; }
  if(!token){ toast('Token wajib diisi.','error'); return; }
  TMP.cand = {url, token}; toast('Menguji koneksi…');
  let r; try { r = await sheetsCall({action:'ping'}, TMP.cand); } catch(e){ toast('Gagal terhubung: '+e.message,'error'); return; }
  if(!r.ok){ toast(r.error === 'Token salah' ? 'Token salah. Klik "Diagnosa koneksi" untuk mencari penyebabnya.' : 'Gagal: '+(r.error || 'respons tidak dikenal'),'error'); return; }
  if(r.rev > 0){
    if(SYNC.enabled && SYNC.url === url && SYNC.token === token){ closeModal(); toast('Koneksi berhasil.'); render(); return; }
    const loggedIn = !!currentUser();
    showModal('Google Sheets sudah berisi data', `<p class="text-sm text-slate-600">Ditemukan data (revisi ${r.rev}) di Google Sheets. Pilih sumber data yang dipakai aplikasi:</p>
      <ul class="text-sm text-slate-600 list-disc pl-5 mt-2 space-y-1"><li><b>Muat dari Google Sheets</b>: data lokal di browser ini diganti.</li>${loggedIn ? '<li><b>Timpa Sheets</b>: data di Sheets diganti data lokal browser ini.</li>' : ''}</ul>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Batal</button>${loggedIn ? `<button class="btn btn-danger" onclick="finishConnect('push')">Timpa Sheets dengan data lokal</button>` : ''}<button class="btn btn-primary" onclick="finishConnect('pull')">Muat dari Google Sheets</button>`, 'max-w-lg');
    return;
  }
  await finishConnect('push');
}
async function finishConnect(mode){
  const c = TMP.cand; if(!c) return;
  closeModal();
  const prev = {url:SYNC.url, token:SYNC.token, enabled:SYNC.enabled, rev:SYNC.rev};
  SYNC.url = c.url; SYNC.token = c.token; SYNC.enabled = true; SYNC.status = 'syncing';
  try {
    if(mode === 'pull'){
      const r = await pullFromSheets(); if(r.empty) throw new Error('data di Sheets kosong');
      UI.view = 'dashboard'; toast('Data dimuat dari Google Sheets.');
    } else {
      const r = await sheetsCall({action:'ping'}); SYNC.rev = r.rev || 0; SYNC.known = new Set();
      await doPush(); if(SYNC.status !== 'ok') throw new Error(SYNC.error || 'gagal mengirim data');
      toast('Data terkirim ke Google Sheets. Database online aktif.');
    }
    saveSyncCfg(); startPolling(); render();
  } catch(e){
    Object.assign(SYNC, prev); SYNC.status = prev.enabled ? 'error' : 'off'; saveSyncCfg(); toast('Gagal menghubungkan: '+e.message,'error'); render();
  }
}
function disconnectSheets(){
  confirmBox('Putuskan koneksi Google Sheets? Data di Sheets tetap ada, tetapi aplikasi kembali memakai data lokal di browser ini.', () => {
    SYNC.enabled = false; SYNC.status = 'off'; clearTimeout(pushTimer); pushTimer = null; clearInterval(pollTimer); saveSyncCfg(); closeModal(); render(); toast('Koneksi Google Sheets diputus.');
  }, {danger:true, ok:'Putuskan'});
}
function genToken(){
  const a = new Uint8Array(24), cs = 'abcdefghjkmnpqrstuvwxyz23456789', g = globalThis.crypto;
  if(g && g.getRandomValues) g.getRandomValues(a); else for(let i = 0; i < a.length; i++) a[i] = Math.floor(Math.random()*256);
  TMP.genToken = Array.from(a, b => cs[b % cs.length]).join('');
  showSetupGuide();
}
function gsCode(){ return $('#gsCode').textContent.replace(/^\n/,'').replace('GANTI_TOKEN_RAHASIA', TMP.genToken || 'GANTI_TOKEN_RAHASIA'); }
function copyGsCode(){
  const code = gsCode();
  const fb = () => { const t = $('#gs_code'); t.select(); try { document.execCommand('copy'); toast('Kode disalin.'); } catch(e){ toast('Salin manual dari kotak kode.','error'); } };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(() => toast('Kode disalin.'), fb); else fb();
}
function showSetupGuide(){
  const steps = ['Buka <b>sheets.new</b> untuk membuat Google Sheet kosong, beri nama misalnya "Katamata Group Database".',
    'Pilih menu <b>Extensions (Ekstensi) → Apps Script</b>. Hapus kode bawaan, lalu tempel kode di bawah.',
    'Ganti nilai <span class="mono">SECRET</span> dengan token rahasia Anda. Atau klik <b>Buat token acak</b> di bawah, kode otomatis terisi.',
    'Klik <b>Deploy → New deployment</b>, pilih tipe <b>Web app</b>. Isi <i>Execute as: Me</i> dan <i>Who has access: Anyone</i>, lalu <b>Deploy</b> dan izinkan akses (Authorize).',
    'Salin <b>Web app URL</b> (berakhiran <span class="mono">/exec</span>), kembali ke pengaturan, tempel URL dan token, lalu klik <b>Hubungkan</b>.'];
  showModal('Panduan setup Google Sheets', `<ol class="list-decimal pl-5 space-y-1.5 text-sm text-slate-700 mb-4">${steps.map(s => `<li>${s}</li>`).join('')}</ol>
    <div class="flex flex-wrap items-center gap-2 mb-3"><button class="btn btn-ghost btn-sm" onclick="genToken()"><i class="fa-solid fa-key"></i>Buat token acak</button>${TMP.genToken ? `<span class="mono text-xs badge b-blue select-all">${esc(TMP.genToken)}</span><span class="text-xs text-slate-500">token ini otomatis terisi di kode dan di form pengaturan</span>` : ''}</div>
    <textarea id="gs_code" class="input mono" style="font-size:11px;line-height:1.45" rows="12" readonly>${esc(gsCode())}</textarea>
    <div class="hint">Setelah mengubah kode di Apps Script, buat versi baru lewat Deploy → Manage deployments → Edit → New version.</div>`,
    `<button class="btn btn-ghost" onclick="download('Code.gs', gsCode(), 'text/plain')"><i class="fa-solid fa-download"></i>Unduh Code.gs</button><button class="btn btn-ghost" onclick="copyGsCode()"><i class="fa-solid fa-copy"></i>Salin kode</button><button class="btn btn-primary" onclick="openSyncForm()">Lanjut ke pengaturan</button>`, 'max-w-3xl');
}

/* =====================================================================
   LOKASI ASET TETAP
   ===================================================================== */
function createPlacement(d){
  const pl = {id:uid('plc_'), assetId:d.assetId, date:d.date, location:d.location, room:d.room, note:d.note || '', status:'active', returnDate:'', createdAt:Date.now(), updatedAt:Date.now(),
    history:[{ts:Date.now(), type:'Penempatan', date:d.date, location:d.location, room:d.room, by:(currentUser() || {}).name || 'Sistem'}]};
  DB.placements.push(pl); syncAssetLocations(DB); return pl;
}
function ensureLocationMaster(location, room){
  if(!DB.locations.some(x => x.location.toLowerCase() === location.toLowerCase() && x.room.toLowerCase() === room.toLowerCase())) DB.locations.push({id:uid('loc_'), location, room});
}
function setPlcTab(k){ UI.tab.placement = k; render(); }
VIEWS.placement = function(){
  const tab = UI.tab.placement || 'active', q = UI.q.plc || '', fl = UI.f.plcLoc || '', hist = tab !== 'active';
  const nA = DB.placements.filter(p => p.status === 'active').length, nH = DB.placements.filter(p => p.status === 'returned').length;
  const locs = [...new Set(DB.placements.map(p => p.location))].sort();
  const list = DB.placements.filter(p => p.status === (hist ? 'returned' : 'active'))
    .map(p => ({p, a:byId(DB.assets, p.assetId)})).filter(x => x.a)
    .filter(x => (!fl || x.p.location === fl) && match(q, x.a.code, itemTitle(x.a), x.a.serial, x.p.location, x.p.room, x.p.note))
    .sort((x,y) => y.p.date.localeCompare(x.p.date) || x.a.code.localeCompare(y.a.code));
  const rows = list.map(({p,a}) => `<tr>
    <td>${tag(a.code)}</td>
    <td><div class="font-semibold">${esc(itemTitle(a))}</div><div class="text-xs text-slate-500">${esc(orgName(a.orgId))} · SN ${esc(a.serial)}</div></td>
    <td class="whitespace-nowrap">${fmtD(p.date)}${hist ? `<div class="text-xs text-slate-500">s.d. ${fmtD(p.returnDate)}</div>` : ''}</td>
    <td><div class="font-semibold">${esc(p.room)}</div><div class="text-xs text-slate-500"><i class="fa-solid fa-location-dot mr-1"></i>${esc(p.location)}</div></td>
    <td>${svcBadge(a.id)}</td>
    <td class="text-xs text-slate-600" style="min-width:140px">${esc(p.note) || '-'}</td>
    <td class="whitespace-nowrap"><button class="btn btn-ghost btn-sm" onclick="showAsset('${a.id}')" title="Detail"><i class="fa-solid fa-eye"></i></button>
      ${can() && !hist ? `<button class="btn btn-ghost btn-sm" onclick="openPlacementForm('${p.id}')" title="Edit lokasi"><i class="fa-solid fa-pen"></i></button><button class="btn btn-warn btn-sm" onclick="openPlacementReturn('${p.id}')" title="Kembalikan ke Stok Aset"><i class="fa-solid fa-rotate-left"></i>Dikembalikan</button>` : ''}${delBtn('deletePlacement', p.id)}</td></tr>`).join('');
  return `${tabsHtml([['active','Lokasi aktif ('+nA+')'],['history','Riwayat dikembalikan ('+nH+')']], tab, 'setPlcTab')}
  <div class="flex flex-wrap items-center gap-2 mb-4"><input id="q_plc" class="input" style="max-width:280px" placeholder="Cari kode, barang, ruangan…" value="${esc(q)}" oninput="setQ('plc',this.value)">
    <select class="input" style="max-width:240px" onchange="setF('plcLoc',this.value)">${opts(locs, fl, x => x, x => x, 'Semua lokasi')}</select><div class="flex-1"></div>
    ${can() ? `<button class="btn btn-primary" onclick="openPlacementForm()"><i class="fa-solid fa-plus"></i>Tetapkan lokasi aset</button>` : ''}</div>
  <div class="card overflow-hidden"><div class="px-4 py-2.5 text-sm text-slate-600 border-b border-slate-200">Aset yang ditetapkan lokasinya tidak tampil di Stok Aset dan tidak dapat dipinjam sampai dikembalikan.</div>
  <div class="overflow-x-auto"><table class="tbl"><thead><tr><th>Kode barang</th><th>Nama barang</th><th>Tanggal</th><th>Ruangan / lokasi</th><th>Status service / maintenance</th><th>Keterangan</th><th>Aksi</th></tr></thead>
  <tbody>${rows || emptyRow(7, hist ? 'Belum ada riwayat pengembalian.' : 'Belum ada aset yang ditetapkan lokasinya.')}</tbody></table></div></div>`;
};
function openPlacementForm(id){
  if(!guard()) return;
  const p = id ? byId(DB.placements, id) : null;
  const avail = p ? [byId(DB.assets, p.assetId)] : DB.assets.filter(a => !activeLoan(a.id) && !activePlacement(a.id)).sort((x,y) => x.code.localeCompare(y.code));
  if(!avail.length || !avail[0]){ toast('Tidak ada aset tersedia di Stok Aset untuk ditetapkan lokasinya.','error'); return; }
  const locs = [...new Set(DB.locations.map(x => x.location))];
  const body = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-3">
    ${fld('Aset dari Stok Aset', `<select id="pl_asset" class="input" ${p ? 'disabled' : ''} onchange="plAsset()">${opts(avail, p ? p.assetId : '', x => x.id, x => x.code+' — '+itemTitle(x)+(inService(x.id) ? ' (Dalam service)' : ''), p ? undefined : 'Pilih kode barang…')}</select>`, 'sm:col-span-2', true)}
    <div id="pl_info" class="sm:col-span-2 rounded-lg p-3 text-sm text-slate-400" style="background:#f6f8fa;border:1px solid var(--line)"></div>
    ${fld('Tanggal penempatan', `<input id="pl_date" type="date" class="input" value="${esc(p ? p.date : todayStr())}">`, 'sm:col-span-2', true)}
    ${fld('Lokasi', `<input id="pl_loc" class="input" list="dl_ploc" oninput="plRooms()" value="${esc(p ? p.location : '')}" placeholder="Pilih atau ketik lokasi"><datalist id="dl_ploc">${locs.map(x => `<option value="${esc(x)}">`).join('')}</datalist>`, '', true)}
    ${fld('Ruangan', `<input id="pl_room" class="input" list="dl_proom" value="${esc(p ? p.room : '')}" placeholder="Pilih atau ketik ruangan"><datalist id="dl_proom"></datalist>`, '', true)}
    ${fld('Keterangan', `<textarea id="pl_note" class="input" rows="2">${esc(p ? p.note : '')}</textarea>`, 'sm:col-span-2')}</div>`;
  showModal(p ? 'Edit lokasi aset tetap' : 'Tetapkan lokasi aset tetap', body, `<button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="savePlacement('${id || ''}')"><i class="fa-solid fa-floppy-disk"></i>Simpan</button>`, 'max-w-2xl');
  plAsset(); plRooms();
}
function plRooms(){
  const loc = val('pl_loc').trim().toLowerCase();
  const rooms = DB.locations.filter(x => !loc || x.location.toLowerCase() === loc).map(x => x.room);
  $('#dl_proom').innerHTML = [...new Set(rooms)].map(r => `<option value="${esc(r)}">`).join('');
}
function plAsset(){
  const a = byId(DB.assets, val('pl_asset')), box = $('#pl_info');
  if(!a){ box.className = 'sm:col-span-2 rounded-lg p-3 text-sm text-slate-400'; box.innerHTML = 'Kode barang, nama barang, brand, tipe, dan spesifikasi terisi otomatis setelah aset dipilih.'; return; }
  box.className = 'sm:col-span-2 rounded-lg p-3 text-sm';
  box.innerHTML = `<div class="flex gap-3"><img src="${esc(imgOf(a))}" class="w-20 h-20 rounded-lg object-cover border border-slate-200" alt=""><dl class="dl flex-1" style="grid-template-columns:110px 1fr">
    <dt>Kode barang</dt><dd>${tag(a.code)}</dd><dt>Nama barang</dt><dd>${esc(itemTitle(a))}</dd><dt>Brand</dt><dd>${esc(a.brand)}</dd><dt>Tipe</dt><dd>${esc(a.type)}</dd>
    <dt>Spesifikasi</dt><dd>${esc(a.spec) || '-'}</dd><dt>Status service</dt><dd>${svcBadge(a.id)}</dd></dl></div>`;
}
function savePlacement(id){
  if(!guard()) return;
  const pl = id ? byId(DB.placements, id) : null;
  const assetId = pl ? pl.assetId : val('pl_asset'), date = val('pl_date'), location = val('pl_loc').trim(), room = val('pl_room').trim(), note = val('pl_note').trim();
  if(!assetId){ toast('Pilih aset dari Stok Aset.','error'); return; }
  if(!date || !location || !room){ toast('Tanggal, lokasi, dan ruangan wajib diisi.','error'); return; }
  const a = byId(DB.assets, assetId);
  if(date < a.buyDate){ toast('Tanggal tidak boleh sebelum tanggal beli aset ('+fmtD(a.buyDate)+').','error'); return; }
  const by = (currentUser() || {}).name || '-';
  if(pl){
    const moved = pl.location !== location || pl.room !== room;
    pl.history = pl.history || []; pl.history.push({ts:Date.now(), type: moved ? 'Pindah lokasi' : 'Ubah data', date, location, room, by});
    Object.assign(pl, {date, location, room, note, updatedAt:Date.now()});
    log((moved ? 'Memindahkan ' : 'Mengubah lokasi ')+a.code+' ke '+location+' / '+room);
  } else {
    if(activeLoan(assetId) || activePlacement(assetId)){ toast('Aset ini sedang dipinjam atau sudah memiliki lokasi tetap.','error'); return; }
    createPlacement({assetId, date, location, room, note});
    log(a.code+' ditempatkan di '+location+' / '+room);
  }
  ensureLocationMaster(location, room); syncAssetLocations(DB); save(); closeModal(); render();
  toast(pl ? 'Lokasi '+a.code+' diperbarui.' : a.code+' ditetapkan di '+room+' dan keluar dari Stok Aset.');
}
function openPlacementReturn(id){
  if(!guard()) return; const p = byId(DB.placements, id), a = byId(DB.assets, p.assetId);
  showModal('Kembalikan aset ke Stok Aset', `<div class="mb-4 text-sm">${tag(a.code)} <span class="ml-2">${esc(itemTitle(a))}</span><div class="text-slate-500 mt-1">Lokasi saat ini: <b>${esc(p.room)}</b>, ${esc(p.location)} (sejak ${fmtD(p.date)})</div></div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${fld('Tanggal dikembalikan', `<input id="pr_date" type="date" class="input" value="${todayStr()}">`, '', true)}${fld('Kondisi saat dikembalikan', `<select id="pr_cond" class="input">${opts(CONDITIONS, a.condition, x => x, x => x)}</select>`)}
    ${fld('Catatan', `<textarea id="pr_note" class="input" rows="2"></textarea>`, 'sm:col-span-2')}</div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="doPlacementReturn('${id}')"><i class="fa-solid fa-rotate-left"></i>Kembalikan ke stok</button>`, 'max-w-lg');
}
function doPlacementReturn(id){
  if(!guard()) return; const p = byId(DB.placements, id), a = byId(DB.assets, p.assetId), date = val('pr_date');
  if(!date){ toast('Tanggal wajib diisi.','error'); return; }
  if(date < p.date){ toast('Tanggal dikembalikan tidak boleh sebelum tanggal penempatan.','error'); return; }
  const note = val('pr_note').trim();
  p.status = 'returned'; p.returnDate = date; p.updatedAt = Date.now(); if(note) p.note = p.note ? p.note+' | '+note : note;
  p.history = p.history || []; p.history.push({ts:Date.now(), type:'Dikembalikan ke Stok Aset', date, location:p.location, room:p.room, by:(currentUser() || {}).name || '-'});
  a.condition = val('pr_cond'); syncAssetLocations(DB);
  log(a.code+' dikembalikan dari '+p.location+' / '+p.room+' ke Stok Aset'); save(); closeModal(); render(); toast(a.code+' kembali ke Stok Aset.');
}
function deletePlacement(id){
  if(!guardDel()) return; const p = byId(DB.placements, id), a = byId(DB.assets, p.assetId) || {code:'-'};
  confirmBox(p.status === 'active'
    ? `Hapus data lokasi <b>${esc(a.code)}</b>? Karena masih aktif, aset otomatis kembali ke Stok Aset.`
    : `Hapus riwayat lokasi <b>${esc(a.code)}</b>?`, () => {
    DB.placements = DB.placements.filter(x => x.id !== id); syncAssetLocations(DB);
    log('Menghapus data lokasi aset tetap '+a.code); save(); render(); toast('Data lokasi aset tetap dihapus.');
  }, {danger:true, ok:'Hapus'});
}
function deleteLoan(id){
  if(!guardDel()) return; const l = byId(DB.loans, id), a = byId(DB.assets, l.assetId) || {code:'-'};
  if(l.status === 'active'){ toast('Peminjaman aktif tidak dapat dihapus. Kembalikan aset terlebih dahulu.','error'); return; }
  confirmBox(`Hapus riwayat peminjaman <b>${esc(a.code)}</b> oleh ${esc(l.empName)}?`, () => {
    DB.loans = DB.loans.filter(x => x.id !== id); log('Menghapus riwayat peminjaman '+a.code); save(); render(); toast('Riwayat peminjaman dihapus.');
  }, {danger:true, ok:'Hapus'});
}
function plHistoryHTML(assetId){
  const ev = []; DB.placements.filter(p => p.assetId === assetId).forEach(p => (p.history || []).forEach(x => ev.push(x)));
  if(!ev.length) return '';
  ev.sort((x,y) => y.ts - x.ts);
  return `<h4 class="font-bold text-ink mt-5 mb-2">Riwayat lokasi aset tetap</h4><div class="overflow-x-auto border border-slate-200 rounded-lg"><table class="tbl"><thead><tr><th>Tanggal</th><th>Kejadian</th><th>Lokasi / ruangan</th><th>Oleh</th></tr></thead><tbody>${ev.map(x => `<tr><td>${fmtD(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.location)} / ${esc(x.room)}</td><td>${esc(x.by)}</td></tr>`).join('')}</tbody></table></div>`;
}
function placementsCard(){
  const act = DB.placements.filter(p => p.status === 'active'), by = {};
  act.forEach(p => { const k = p.location+' / '+p.room; by[k] = (by[k] || 0) + 1; });
  const keys = Object.keys(by).sort((a,b) => by[b] - by[a]).slice(0,6), max = Math.max(0, ...keys.map(k => by[k]));
  return `<div class="card p-5 mb-4"><div class="flex items-center justify-between mb-3"><h3 class="font-bold text-ink">Lokasi aset tetap</h3><button class="text-sm underline" style="color:var(--brand)" onclick="navigate('placement')">Lihat semua (${act.length})</button></div>
    ${keys.length ? keys.map(k => barRow(k, by[k], max, by[k]+' aset', 'var(--brand)')).join('') : '<div class="text-sm text-slate-400">Belum ada aset yang ditetapkan di lokasi tetap.</div>'}</div>`;
}

/* ---------- Link undangan & peringatan keamanan ---------- */
function inviteLink(){
  const b = btoa(JSON.stringify({u:SYNC.url, t:SYNC.token})).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return location.href.split('#')[0] + '#sheets=' + b;
}
function parseInvite(){
  try {
    const m = (location.hash || '').match(/^#sheets=([\w-]+)$/); if(!m) return null;
    let b = m[1].replace(/-/g,'+').replace(/_/g,'/'); b += '='.repeat((4 - b.length % 4) % 4);
    const o = JSON.parse(atob(b));
    if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(o.u || '') || !o.t) return null;
    return o;
  } catch(e){ return null; }
}
function copyInviteLink(){
  if(location.protocol === 'file:'){ toast('Buka aplikasi dari alamat GitHub Pages (https://…) dulu, baru buat link undangan.','error'); return; }
  const link = inviteLink();
  confirmBox('Link ini memuat <b>URL dan token</b> Google Sheets. Siapa pun yang memilikinya dapat membaca dan menulis data. Bagikan hanya ke orang yang dipercaya (lewat chat pribadi, bukan di tempat umum).', () => {
    const fb = () => { prompt('Salin link undangan ini:', link); };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(() => toast('Link undangan disalin.'), fb); else fb();
  }, {ok:'Salin link'});
}
const _dashBase = VIEWS.dashboard;
VIEWS.dashboard = function(){
  let warn = '';
  if(isSA()){
    const weak = DB.users.filter(u => u.passHash === hashPw(defaultPw(u.role)));
    if(weak.length) warn = `<div class="mb-4 rounded-lg border border-red-300 bg-red-50 text-red-900 px-4 py-3 text-sm flex flex-wrap items-center gap-3"><i class="fa-solid fa-triangle-exclamation"></i><div class="flex-1 min-w-[220px]"><b>${weak.length} akun masih memakai password bawaan</b> (${weak.map(u => esc(u.username)).join(', ')}). Ganti sebelum aplikasi dibuka untuk orang lain.</div><button class="btn btn-danger btn-sm" onclick="navigate('users')">Kelola user</button></div>`;
  }
  let base = _dashBase(); const pc = placementsCard(), key = '<div class="card p-5"><h3 class="font-bold text-ink mb-3">Aktivitas terakhir</h3>';
  base = base.includes(key) ? base.replace(key, () => pc + key) : base + pc;
  return warn + base;
};

/* ---------- Mulai ---------- */
(async function boot(){
  DB = loadDB(); saveLocal();
  const inv = parseInvite();
  if(inv){
    if(!(SYNC.enabled && SYNC.url === inv.u && SYNC.token === inv.t)){ SYNC.url = inv.u; SYNC.token = inv.t; SYNC.enabled = true; SYNC.status = 'idle'; SYNC.rev = 0; saveSyncCfg(); }
    try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  }
  if(SYNC.enabled && SYNC.url){
    $('#app').style.display = 'none';
    $('#loginRoot').innerHTML = '<div class="min-h-screen flex items-center justify-center"><div class="text-center text-slate-500"><i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3" style="color:var(--brand)"></i><div class="font-semibold text-ink">Menghubungkan ke Google Sheets…</div></div></div>';
    try {
      const r = await pullFromSheets();
      if(r.empty){ SYNC.rev = r.rev; SYNC.known = new Set(); await doPush(); }
    } catch(e){
      SYNC.status = 'error'; SYNC.error = e.message;
      toast('Tidak dapat terhubung ke Google Sheets, memakai data lokal. ('+e.message+')','error');
    }
    $('#loginRoot').innerHTML = '';
  }
  render(); startPolling();
})();
</script>
